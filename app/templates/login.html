<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập DigiTeacher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-4">
            <div class="card shadow border-0">

                <div class="card-header text-center bg-primary text-white">
                    <h3 class="mb-0 font-weight-bold">DigiTeacher</h3>
                </div>

                <div class="card-body p-4">

                    <!-- Hiển thị thông báo lỗi từ Flask flash -->
                    {% with messages = get_flashed_messages() %}
                      {% if messages %}
                        {% for message in messages %}
                          <div class="alert alert-danger p-2 text-center mb-3" role="alert">
                            {{ message }}
                          </div>
                        {% endfor %}
                      {% endif %}
                    {% endwith %}

                    <form action="/login" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Email hoặc Mã GV</label>
                            <input type="text" name="email" class="form-control" placeholder="Nhập Email hoặc Mã GV..." required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Mật khẩu</label>
                            <input type="password" name="password" class="form-control" placeholder="••••••" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 fw-bold">
                            Đăng nhập
                        </button>

                    </form>

                </div>

            </div>
        </div>
    </div>
</div>

</body>
</html>
